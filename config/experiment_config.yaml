# Full Sweep Configuration
# ========================
# All experiments in one config - runs in single command, saves to one folder
#
# Usage:
#   python simulations/run_experiments.py --config config/full_sweep.yaml --n_seeds 10

wandb:
  enabled: false
  project: "fspmi-report"
  entity: null
  tags: ["report", "racetrack", "full_sweep"]

environment:
  name: "racetrack"
  params:
    initial_configuration: [0.5, 0.5, 0, 0]
    track_file: T1
    pfail: 0.07

model_chooser:
  type: "greedy"
  gp:
    beta: 2.0
    gp_update_frequency: 10
  greedy:
    do_not_create_transitions: true

output:
  dir: "./data/final"
  save_gp_metrics: false
  save_sapmi_metrics: false

experiments:
  # SPMI Baseline
  standard_spmi:
    enabled: true
    max_iter: 50

  sapmi:
    enabled: false
    max_iter: 50
    curricula:
      - name: linear_soft
        description: "Linear curriculum, mild robustness"
        type: linear
        start_iter: 0
        end_iter: 1000
        start_weight: 0.0
        end_weight: 1.0
        robustness_temperature: 1.5
        entropy_bonus: 0.01

  # F-SPMI: Full grid of N x eps/round
  federated_spmi:
    enabled: true
    configurations:
      # N=2, varying eps/round
      - n_agents: 2
        episodes_per_round: 100
        max_rounds: 50
      - n_agents: 2
        episodes_per_round: 200
        max_rounds: 50
      - n_agents: 2
        episodes_per_round: 400
        max_rounds: 50
      - n_agents: 2
        episodes_per_round: 800
        max_rounds: 50
      
      # N=4, varying eps/round
      - n_agents: 4
        episodes_per_round: 100
        max_rounds: 50
      - n_agents: 4
        episodes_per_round: 200
        max_rounds: 50
      - n_agents: 4
        episodes_per_round: 400
        max_rounds: 50
      - n_agents: 4
        episodes_per_round: 800
        max_rounds: 50
      
      # N=8, varying eps/round
      - n_agents: 8
        episodes_per_round: 100
        max_rounds: 50
      - n_agents: 8
        episodes_per_round: 200
        max_rounds: 50
      - n_agents: 8
        episodes_per_round: 400
        max_rounds: 50
      - n_agents: 8
        episodes_per_round: 800
        max_rounds: 50

  federated_sapmi:
    enabled: false
    agent_counts: [4, 8]
    episodes_per_round: 400
    max_rounds: 50
    curricula:
      - name: const_robust
        description: "Constant robustness"
        type: constant
        weight: 0.8
        robustness_temperature: 0.5
        entropy_bonus: 0.01