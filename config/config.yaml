# Improved Configuration Based on Initial Results
# ===============================================
wandb:
  enabled: false
  project: "spmi-test"
  entity: null
  tags: []

environment:
  name: "racetrack"
  params:
    initial_configuration: [0.5, 0.5, 0, 0]
    track_file: T1
    pfail: 0.07

model_chooser:
  type: "greedy" # GB 
  gp:
    beta: 1.0
    gp_update_frequency: 30
  greedy:
    do_not_create_transitions: true


output:
  dir: "./data/"
  save_gp_metrics: false
  save_sapmi_metrics: true

experiments:
  # Baseline
  standard_spmi:
    enabled: true
    max_iter: 2000
  
  # Test multiple SA-PMI configurations
  sapmi:
    enabled: true
    max_iter: 2000
    curricula:
      # Lower robustness - should perform better
      - name: "constant_low"
        type: "constant"
        weight: 0.2
        robustness_temperature: 0.3
        entropy_bonus: 0.0
        description: "Low robustness (20%)"
      
      - name: "constant_medium"
        type: "constant"
        weight: 0.4
        robustness_temperature: 0.3
        entropy_bonus: 0.0
        description: "Medium robustness (40%)"
      
      # Dynamic curriculum - starts greedy, adds robustness later
      - name: "linear"
        type: "linear"
        start_iter: 100
        end_iter: 5000
        start_weight: 0.0
        end_weight: 0.3
        robustness_temperature: 0.3
        entropy_bonus: 0.0
        description: "Linear curriculum 0→30%"
  
  # Improved federated settings
  federated_spmi:
    enabled: true
    configurations:
      # More agents for better exploration
      - n_agents: 4
        episodes_per_round: 400
        max_rounds: 2000

  federated_sapmi:
      enabled: true
      agent_counts: [2,4]
      episodes_per_round: 100
      max_rounds: 2000
      curricula:
        - name: "constant_low"
          type: "constant"
          weight: 0.2
          robustness_temperature: 0.3
          entropy_bonus: 0.0
          description: "Low robustness (20%)"
        
        - name: "constant_medium"
          type: "constant"
          weight: 0.4
          robustness_temperature: 0.3
          entropy_bonus: 0.0
          description: "Medium robustness (40%)"